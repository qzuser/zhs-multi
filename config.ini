[common]
; 是否使用本地已保存的 Cookie（state\cookies.json）
; true  = 优先复用登录态，过期了再扫码登录一次
; false = 每次都重新扫码登录
use_cookies = true

; 登录方式只有扫码一种（智慧树 APP → 扫一扫）
; 没有 APP 的话：zhs-multi.bat login --cookie "JSESSIONID=...; CASTGC=..." 从浏览器导入

; 要刷的课程序号，逗号分隔（1 / 1,3 / 2-4 / all）
; 留空 = 运行时交互选择
course_list =

; 并发线程数（同时刷几个视频，1-32）。默认 4
; 注意：知到对同账号并发敏感——实测 3 线程约 7 分钟会撞「疑是多窗口观看(-10)」，
; 攒够就升级成图形验证码(-12)。所以 4 线程时下面 [stealth] adaptive 一定要开着，
; 它会一撞 -10 就把并发压回去；想全程稳就用 -j 1 或 -j 2
jobs = 1

; 视频倍速（1.0 - 2.0）
speed = 2

; 视频完成阈值（0.1 - 1.2）：>=0.91 默认；1.01 表示强制重刷已完成的
threshold = 0.91

; 本轮总时间上限（分钟，0 = 不限）
limit = 0

; 每个任务之间的额外间隔（秒），防止请求过密触发风控
delay = 0.6
stagger = 2.0

; 已完成的视频是否也重刷
force = false

; 是否显示单行总览进度（多线程时好看；关掉则逐条打印）
dashboard = true

; 撞到验证码(-12)时自动解锁最多等多少秒（unblock / --auto-unblock 用）
unblock_wait = 900

[ai]
; 智慧课程（AI 课）：是否连「选学」资料一起刷（true = 文本/PPT/视频全刷）
learn_optional = true

; 智慧课程视频完成阈值（0-100）
video_threshold = 90

[homework]
; 刷完视频是否接着做章节作业
enable = false
; 作业达标线（0-100）
threshold = 100
; 最大重做次数（0 = 不限）
max_submit = 2

[question_bank]
; 第三方题库（enncy）。命中就直接提交答案，不用 LLM、也不用随机
; token 在 https://tk.enncy.cn 个人中心 → 更多配置 里拿
enabled = false
token =
url = https://tk.enncy.cn/query

[output]
; DEBUG 日志
verbose = false
; 保留字段
color = true

[stealth]
; 风控应对。平台认脚本靠的是"节奏"，这几项就是把节奏改得像人。
;
; 撞到 -10（疑是多窗口观看）就自动压并发 + 拉长间隔，冷却 3 分钟后再慢慢放回
adaptive = true

; 每刷完几条长休息一次（0 = 不休息）。默认 6 条歇 15~30 秒：
; 够打断"机器节奏"，又不至于白白等掉半小时。想彻底不歇就填 0
rest_every = 6
rest_seconds = 15-30

; 夜间不刷（模拟正常作息）。默认关；打开后 0:00-6:00 只等不刷，适合挂通宵
night_off = false
night_from = 0
night_to = 6

; 每天最多刷几条（0 = 不限）。平台 -9 是"学习时长上限"，一天刷太多容易顶到；
; 想细水长流就填个 30~50。计数存在 state\daily.json
max_per_day = 0

; 上报载荷里的设备标识。**必须留 zhs**：
; 平台解 sdsew 时要按原样校验这个字段，换成别的值会直接回
; 「-1 参数解码发生错误」，一条进度都记不上（2026-11-23 实测）。
; auto = 每账号随机 9 位（历史实验选项，会坏，别用）
device_tag = zhs
