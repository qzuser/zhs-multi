[common]
; 是否使用本地已保存的 Cookie（state\cookies.json）
; true  = 优先复用登录态，过期了再扫码登录一次
; false = 每次都重新扫码登录
use_cookies = true

; 登录方式只有扫码一种（智慧树 APP → 扫一扫）
; 没有 APP 的话：zhs-multi.bat login --cookie "JSESSIONID=...; CASTGC=..." 从浏览器导入

; 要刷的课程序号，逗号分隔（1 / 1,3 / 2-4 / all）
; 留空 = 运行时交互选择
course_list =

; 并发线程数（同时刷几个视频，1-32）
; 实测：3 线程约 7 分钟会被平台要求图形验证码（-12），2 线程是稳妥默认值
jobs = 2

; 视频倍速（1.0 - 2.0）
speed = 1.5

; 视频完成阈值（0.1 - 1.2）：>=0.91 默认；1.01 表示强制重刷已完成的
threshold = 0.91

; 本轮总时间上限（分钟，0 = 不限）
limit = 0

; 每个任务之间的额外间隔（秒），防止请求过密触发风控
delay = 0.6
stagger = 2.0

; 已完成的视频是否也重刷
force = false

; 是否显示单行总览进度（多线程时好看；关掉则逐条打印）
dashboard = true

; 撞到验证码(-12)时自动解锁最多等多少秒（unblock / --auto-unblock 用）
unblock_wait = 900

[ai]
; 作业/考试用的 OpenAI 兼容接口；不填则作业只能随机作答
api_key =
base_url = https://api.deepseek.com/v1
model = deepseek-chat

; 智慧课程（AI 课）：是否连「选学」资料一起刷（true = 文本/PPT/视频全刷）
learn_optional = true

; 智慧课程视频完成阈值（0-100）
video_threshold = 90

[homework]
; 刷完视频是否接着做章节作业
enable = false
; 作业达标线（0-100）
threshold = 100
; 最大重做次数（0 = 不限）
max_submit = 2

[output]
; DEBUG 日志
verbose = false
; 保留字段
color = true

[stealth]
; 风控应对。平台认脚本靠的是"节奏"，这几项就是把节奏改得像人。
;
; 撞到 -10（疑是多窗口观看）就自动压并发 + 拉长间隔，冷却 3 分钟后再慢慢放回
adaptive = true

; 每刷完几条长休息一次（0 = 不休息）。默认 4 条歇 1~3 分钟，
; 比一口气刷 20 条安全得多，代价只是慢一点
rest_every = 4
rest_seconds = 60-180

; 夜间不刷（模拟正常作息）。默认关；打开后 0:00-6:00 只等不刷，适合挂通宵
night_off = false
night_from = 0
night_to = 6

; 每天最多刷几条（0 = 不限）。平台 -9 是"学习时长上限"，一天刷太多容易顶到；
; 想细水长流就填个 30~50。计数存在 state\daily.json
max_per_day = 0
